<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>HImpact</title>
    <!--
      GitHub Pages SPA redirect.
      When a user navigates directly to a React Router path (e.g. /sign-in),
      GitHub Pages serves this 404.html. This script converts the path to a
      query parameter and redirects to index.html, where React Router handles it.

      Technique: https://github.com/rafgraph/spa-github-pages
    -->
    <script>
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
