# Docker Compose V2 — version key removed (deprecated, ignored by Compose V2+)

services:
  postgres:
    image: postgres:16-alpine
    container_name: himpact-prod-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-HIMPACT_DB}
      POSTGRES_USER: ${POSTGRES_USER:-himpact_prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hamdy}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-himpact_prod} -d ${POSTGRES_DB:-HIMPACT_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: himpact-prod-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-HIMPACT_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-himpact_prod}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-hamdy}
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-strong-256-bit-secret-in-production}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://himpact.app}
    volumes:
      - uploads_prod_data:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: himpact-prod-frontend
    restart: always
    depends_on:
      - backend

  proxy:
    image: nginx:1.27-alpine
    container_name: himpact-prod-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_prod_data:
  uploads_prod_data:
