spring:
  config:
    activate:
      on-profile: prod

  jpa:
    show-sql: false

  flyway:
    baseline-on-migrate: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.himpact: INFO
    org.springframework: WARN
    org.hibernate: WARN
