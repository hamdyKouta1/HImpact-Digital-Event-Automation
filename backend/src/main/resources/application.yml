spring:
  application:
    name: himpact-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/HIMPACT_DB}
    username: ${SPRING_DATASOURCE_USERNAME:himpact}
    password: ${SPRING_DATASOURCE_PASSWORD:hamdy}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:20}
      minimum-idle: ${HIKARI_MIN_IDLE:5}
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  # spring.security.oauth2.resourceserver.jwt removed.
  # The project uses a custom JwtAuthenticationFilter with HImpact-issued tokens.
  # The resource-server auto-configuration conflicts: it creates a second JWT decoder
  # that contacts https://accounts.google.com at startup (OIDC discovery), causing
  # startup failures in offline environments and duplicate security filter chains.

  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: application/json,text/plain

# Sprint 6 Workstream C — Actuator, Health Probes & Micrometer Prometheus
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      # Exclude mail from health — SMTP creds are not required for local dev.
      # Without this, empty SMTP_USERNAME/PASSWORD causes status=DOWN → HTTP 503.
      group:
        readiness:
          exclude: mail
  prometheus:
    metrics:
      export:
        # Correct key for Spring Boot 3.2+.
        # Deprecated key was: management.metrics.export.prometheus.enabled
        enabled: true
    tags:
      application: ${spring.application.name}

# Application-specific configuration
himpact:
  security:
    jwt:
      secret: ${JWT_SECRET:change-this-to-a-strong-256-bit-secret-in-production}
      expiration-ms: ${JWT_EXPIRATION_MS:3600000}
      refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    drive:
      application-name: ${GOOGLE_DRIVE_APPLICATION_NAME:HImpact}
      credentials-path: ${GOOGLE_DRIVE_CREDENTIALS_PATH:}

logging:
  level:
    com.himpact: INFO
    org.springframework.security: WARN
